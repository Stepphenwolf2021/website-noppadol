name: Tool catalog validation
on:
  push:
    branches: [main]
    paths: ['tool-stewardship/**', 'tests/tool-catalog.test.mjs', 'tests/multi-catalog.test.mjs', '.github/workflows/tool-catalog-tests.yml']
  pull_request:
    paths: ['tool-stewardship/**', 'tests/tool-catalog.test.mjs', 'tests/multi-catalog.test.mjs', '.github/workflows/tool-catalog-tests.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/tool-catalog.test.mjs tests/multi-catalog.test.mjs tests/knowledge-graph.test.mjs
